name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A3DB78: ${{ secrets.A3DB78 }}
          B2A7B9: ${{ secrets.B2A7B9 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A3DB78', ''), os.environ.get('B2A7B9', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- f3589061db3149b5ea56b76b6d2139b89c682aa6 -->', a)
          if b:
              patched = patched.replace('<!-- cf501e973949d23fa48f8d12ceaed510 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
